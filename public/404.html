<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Not Found" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-xiaolai-sc-regular@1.0.2/font.css" />
  <title>Not Found · fyapeng.com</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="domain" href="/" aria-label="fyapeng.com"><span class="dot" aria-hidden="true"></span><span>fyapeng.com</span></a>
      <a class="return-home" href="/">返回首页</a>
    </header>

    <section class="farewell" aria-labelledby="farewell-title">
      <div class="sandscape" aria-hidden="true">
        <span class="dune dune-a"></span><span class="dune dune-b"></span><span class="dune dune-c"></span>
        <span class="dust dust-a"></span><span class="dust dust-b"></span>
      </div>

      <div class="panel">
        <p class="overline">404 · 暂别</p>
        <h1 id="farewell-title">Not Found</h1>

        <div class="poem" aria-label="陶渊明《形影神三首·神释》句">
          <p>甚念伤吾生，正宜委运去。</p>
          <p>纵浪大化中，不喜亦不惧。</p>
          <p>应尽便须尽，无复独多虑。</p>
        </div>

        <div class="translation" lang="en">
          <p>Overthinking harms—let the current take you.</p>
          <p>Amid the vast flux, no joy, no fear.</p>
          <p>When it ends, it ends.</p>
          <p>Why worry by yourself?</p>
        </div>

        <div class="actions">
          <a class="primary" href="/">回到首页</a>
          <a class="secondary" href="mailto:yp@fyapeng.com">若需联系</a>
        </div>
      </div>
    </section>

    <footer><span>Beijing · China</span><span>© 2026 Yapeng Fu</span></footer>
  </main>
</body>
</html>

<style>
